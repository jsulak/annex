[defaults]
# host_key_checking is left at default (true).
# For first-time provisioning of a new droplet, pass:
#   ANSIBLE_HOST_KEY_CHECKING=false make provision
timeout = 60
forks = 1
pipelining = true

[ssh_connection]
retries = 5
control_path_dir = /tmp/ansible-cp
ssh_args = -C -o ControlMaster=auto -o ControlPersist=300s -o ServerAliveInterval=30 -o ServerAliveCountMax=4 -o ConnectTimeout=30
