---
- name: Provision Annex VPS
  hosts: all
  become: true
  tasks:
    - name: Require a distinct admin account and HTTPS domain
      ansible.builtin.assert:
        that:
          - admin_user != app_user
          - admin_user != 'root'
          - domain | length > 0

    # ── System packages ──────────────────────────────────────
    - name: Update apt cache
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600

    - name: Upgrade installed OS packages without removing packages
      ansible.builtin.apt:
        upgrade: safe
        force_apt_get: true
        fail_on_autoremove: true

    - name: Install base packages
      ansible.builtin.apt:
        name:
          - curl
          - rsync
          - gnupg
          - debian-keyring
          - debian-archive-keyring
          - apt-transport-https
          - ufw
          - fail2ban
          - unattended-upgrades
          - apt-listchanges
          - sudo
          - logrotate
          - debian-security-support
        state: present

    # ── Automatic security updates ───────────────────────────
    - name: Enable unattended-upgrades
      ansible.builtin.copy:
        dest: /etc/apt/apt.conf.d/20auto-upgrades
        content: |
          APT::Periodic::Update-Package-Lists "1";
          APT::Periodic::Unattended-Upgrade "1";
          APT::Periodic::AutocleanInterval "7";
        owner: root
        group: root
        mode: "0644"

    # ── App user ─────────────────────────────────────────────
    - name: Create app user
      ansible.builtin.user:
        name: "{{ app_user }}"
        shell: /bin/bash
        create_home: true

    - name: Authorize SSH key for app user
      ansible.posix.authorized_key:
        user: "{{ app_user }}"
        key: "{{ lookup('file', '~/.ssh/' + lookup('env', 'TF_VAR_ssh_key_name') + '.pub') }}"
        state: present

    - name: Create independent administrative account
      ansible.builtin.user:
        name: "{{ admin_user }}"
        shell: /bin/bash
        create_home: true
        password_lock: true

    - name: Authorize the admin SSH public key
      ansible.posix.authorized_key:
        user: "{{ admin_user }}"
        key: "{{ lookup('file', admin_ssh_public_key_file) }}"
        state: present

    - name: Grant root administration to the key-only admin account
      ansible.builtin.copy:
        dest: "/etc/sudoers.d/{{ admin_user }}"
        content: "{{ admin_user }} ALL=(root) NOPASSWD: ALL\n"
        owner: root
        group: root
        mode: '0440'
        validate: /usr/sbin/visudo -cf %s

    # ── SSH hardening ────────────────────────────────────────
    - name: Disable SSH password authentication
      ansible.builtin.lineinfile:
        path: /etc/ssh/sshd_config
        regexp: '^#?PasswordAuthentication'
        line: 'PasswordAuthentication no'
        validate: 'sshd -t -f %s'
      notify: Restart sshd

    - name: Disable SSH root login
      ansible.builtin.lineinfile:
        path: /etc/ssh/sshd_config
        regexp: '^#?PermitRootLogin'
        line: 'PermitRootLogin no'
        validate: 'sshd -t -f %s'
      notify: Restart sshd

    - name: Disable SSH challenge-response authentication
      ansible.builtin.lineinfile:
        path: /etc/ssh/sshd_config
        regexp: '^#?KbdInteractiveAuthentication'
        line: 'KbdInteractiveAuthentication no'
        validate: 'sshd -t -f %s'
      notify: Restart sshd

    - name: Restrict SSH to app and admin users
      ansible.builtin.lineinfile:
        path: /etc/ssh/sshd_config
        regexp: '^#?AllowUsers'
        line: 'AllowUsers {{ app_user }} {{ admin_user }}'
        validate: 'sshd -t -f %s'
      notify: Restart sshd

    # ── Fail2ban ─────────────────────────────────────────────
    - name: Configure fail2ban for SSH
      ansible.builtin.copy:
        dest: /etc/fail2ban/jail.local
        content: |
          [DEFAULT]
          bantime = 1h
          findtime = 10m
          maxretry = 5

          [sshd]
          enabled = true
          port = ssh
          backend = systemd
        owner: root
        group: root
        mode: "0644"
      notify: Restart fail2ban

    - name: Enable and start fail2ban
      ansible.builtin.systemd:
        name: fail2ban
        enabled: true
        state: started

    # ── Firewall (UFW) ───────────────────────────────────────
    - name: Allow SSH through UFW
      community.general.ufw:
        rule: allow
        port: "22"
        proto: tcp

    - name: Allow HTTP through UFW
      community.general.ufw:
        rule: allow
        port: "80"
        proto: tcp

    - name: Allow HTTPS through UFW
      community.general.ufw:
        rule: allow
        port: "443"
        proto: tcp

    - name: Enable UFW with default deny
      community.general.ufw:
        state: enabled
        default: deny
        direction: incoming

    # ── Node.js ──────────────────────────────────────────────
    - name: Add NodeSource GPG key
      ansible.builtin.get_url:
        url: https://deb.nodesource.com/gpgkey/nodesource-repo.gpg.key
        dest: /usr/share/keyrings/nodesource.asc
        mode: "0644"

    - name: Add NodeSource repository
      ansible.builtin.apt_repository:
        repo: "deb [signed-by=/usr/share/keyrings/nodesource.asc] https://deb.nodesource.com/node_{{ node_version }}.x nodistro main"
        state: present
        filename: nodesource

    - name: Install Node.js
      ansible.builtin.apt:
        name: nodejs
        state: latest
        update_cache: true

    - name: Install PM2 globally
      community.general.npm:
        name: pm2
        global: true
        state: latest

    # ── App directories ──────────────────────────────────────
    - name: Create app directory
      ansible.builtin.file:
        path: "{{ app_dir }}"
        state: directory
        owner: "{{ app_user }}"
        group: "{{ app_user }}"
        mode: "0755"

    - name: Create notes directory
      ansible.builtin.file:
        path: "{{ notes_dir }}"
        state: directory
        owner: "{{ app_user }}"
        group: "{{ app_user }}"
        mode: "0750"

    # ── Caddy ────────────────────────────────────────────────
    - name: Add Caddy GPG key
      ansible.builtin.get_url:
        url: https://dl.cloudsmith.io/public/caddy/stable/gpg.key
        dest: /usr/share/keyrings/caddy.asc
        mode: "0644"

    - name: Add Caddy repository
      ansible.builtin.apt_repository:
        repo: "deb [signed-by=/usr/share/keyrings/caddy.asc] https://dl.cloudsmith.io/public/caddy/stable/deb/debian any-version main"
        state: present
        filename: caddy-stable

    - name: Install Caddy
      ansible.builtin.apt:
        name: caddy
        state: latest
        update_cache: true

    - name: Create the Caddy service drop-in directory
      ansible.builtin.file:
        path: /etc/systemd/system/caddy.service.d
        state: directory
        owner: root
        group: root
        mode: '0755'

    - name: Configure private Caddy admin socket and reload command
      ansible.builtin.copy:
        dest: /etc/systemd/system/caddy.service.d/annex-admin-socket.conf
        content: |
          [Service]
          RuntimeDirectory=caddy-admin
          RuntimeDirectoryMode=0700
          ExecReload=
          ExecReload=/usr/bin/caddy reload --config /etc/caddy/Caddyfile --address unix//run/caddy-admin/admin.sock --force
        owner: root
        group: root
        mode: '0644'
      notify: Restart Caddy

    - name: Deploy Caddyfile
      ansible.builtin.template:
        src: templates/Caddyfile.j2
        dest: /etc/caddy/Caddyfile
        owner: root
        group: root
        mode: "0644"
        validate: /usr/bin/caddy validate --adapter caddyfile --config %s
      notify: Restart Caddy

    - name: Enable and start Caddy
      ansible.builtin.systemd:
        name: caddy
        enabled: true
        state: started

    # ── Syncthing ──────────────────────────────────────────
    - name: Read the installed Syncthing version
      ansible.builtin.command: dpkg-query -W -f=${Version} syncthing
      register: syncthing_installed
      check_mode: false
      changed_when: false
      failed_when: syncthing_installed.rc not in [0, 1]

    - name: Select the Syncthing repository channel
      ansible.builtin.set_fact:
        syncthing_channel: "{{ syncthing_apt_channel or ('stable' if syncthing_installed.rc == 0 and syncthing_installed.stdout is match('^([0-9]+:)?1[.]') else 'stable-v2') }}"

    - name: Add Syncthing GPG key
      ansible.builtin.get_url:
        url: https://syncthing.net/release-key.gpg
        dest: /usr/share/keyrings/syncthing-archive-keyring.gpg
        mode: "0644"

    - name: Add Syncthing repository
      ansible.builtin.apt_repository:
        repo: "deb [signed-by=/usr/share/keyrings/syncthing-archive-keyring.gpg] https://apt.syncthing.net/ syncthing {{ syncthing_channel }}"
        state: present
        filename: syncthing

    - name: Install Syncthing
      ansible.builtin.apt:
        name: syncthing
        state: latest
        update_cache: true

    - name: Create Syncthing config directory
      ansible.builtin.file:
        path: "/home/{{ app_user }}/.local/state/syncthing"
        state: directory
        owner: "{{ app_user }}"
        group: "{{ app_user }}"
        mode: "0700"

    - name: Enable and start Syncthing for app user
      ansible.builtin.systemd:
        name: "syncthing@{{ app_user }}"
        enabled: true
        state: started

    - name: Wait for Syncthing config to be generated
      ansible.builtin.wait_for:
        path: "/home/{{ app_user }}/.local/state/syncthing/config.xml"
        timeout: 60

    - name: Verify Syncthing is running
      ansible.builtin.command:
        cmd: "systemctl is-active syncthing@{{ app_user }}"
      register: syncthing_status
      changed_when: false
      failed_when: syncthing_status.stdout != 'active'

    - name: Remove broad Syncthing ingress allowances
      community.general.ufw:
        rule: allow
        delete: true
        port: "{{ item.port }}"
        proto: "{{ item.proto }}"
      loop:
        - { port: "22000", proto: tcp }  # TCP sync, previously allowed
        - { port: "22000", proto: udp }  # QUIC sync
        - { port: "21027", proto: udp }  # Local discovery, previously allowed

    # ── Log rotation ─────────────────────────────────────────
    - name: Deploy logrotate config for annex PM2 logs
      ansible.builtin.template:
        src: templates/logrotate-annex.j2
        dest: /etc/logrotate.d/annex
        owner: root
        group: root
        mode: "0644"

    - name: Enable system log rotation timer
      ansible.builtin.systemd:
        name: logrotate.timer
        enabled: true
        state: started

    - name: Install update status check
      ansible.builtin.copy:
        src: files/annex-update-status
        dest: /usr/local/sbin/annex-update-status
        owner: root
        group: root
        mode: '0755'

    - name: Install the daily update status units
      ansible.builtin.copy:
        src: "files/{{ item }}"
        dest: "/etc/systemd/system/{{ item }}"
        owner: root
        group: root
        mode: '0644'
      loop:
        - annex-update-status.service
        - annex-update-status.timer

    - name: Enable daily update status reporting
      ansible.builtin.systemd:
        name: annex-update-status.timer
        daemon_reload: true
        enabled: true
        state: started

    # ── PM2 startup ──────────────────────────────────────────
    - name: Check if PM2 startup is configured
      ansible.builtin.stat:
        path: "/etc/systemd/system/pm2-{{ app_user }}.service"
      register: pm2_service

    - name: Configure PM2 startup for app user
      ansible.builtin.command:
        cmd: "env PATH=$PATH:/usr/bin pm2 startup systemd -u {{ app_user }} --hp /home/{{ app_user }}"
      when: not pm2_service.stat.exists
      changed_when: true

  handlers:
    - name: Restart Caddy
      ansible.builtin.systemd:
        name: caddy
        daemon_reload: true
        state: restarted

    - name: Restart sshd
      ansible.builtin.systemd:
        name: sshd
        state: restarted

    - name: Restart fail2ban
      ansible.builtin.systemd:
        name: fail2ban
        state: restarted
